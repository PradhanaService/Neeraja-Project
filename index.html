<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizSpark</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <main class="auth-page">
        <section class="auth-box">
            <h1>QuizSpark</h1>
            <p class="muted">Create a quiz, share a code, and let students play.</p>

            <div class="tabs">
                <button class="tab-btn active" id="showLogin" type="button">Login</button>
                <button class="tab-btn" id="showRegister" type="button">Register</button>
            </div>

            <form id="loginForm" class="form">
                <label>Email</label>
                <input type="email" id="loginEmail" required>

                <label>Password</label>
                <input type="password" id="loginPassword" required>

                <button type="submit">Login</button>
            </form>

            <form id="registerForm" class="form hidden">
                <label>Name</label>
                <input type="text" id="registerName" required>

                <label>Email</label>
                <input type="email" id="registerEmail" required>

                <label>Password</label>
                <input type="password" id="registerPassword" required>

                <button type="submit">Register</button>
            </form>

            <p id="message" class="message"></p>
        </section>
    </main>

    <script type="module" src="assets/js/auth.js"></script>
</body>
</html>
